name: Import Hermes Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'MoatasimFaroog1111/hermos'
    runs-on: ubuntu-latest
    steps:
      - name: Import exact Hermes Agent snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPOSITORY: NousResearch/hermes-agent
          SOURCE_COMMIT: 7c6caac160a4822bb1728c968359ff8b4cd9f436
        run: |
          set -euo pipefail

          git init mirror
          cd mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --depth=1 upstream "${SOURCE_COMMIT}"

          source_tree="$(git rev-parse FETCH_HEAD^{tree})"
          imported_commit="$(printf '%s\n' 'Import Hermes Agent source snapshot' | git commit-tree "${source_tree}")"

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${imported_commit}:refs/heads/main"
