name: Railway Digital Human smoke

on:
  push:
    branches: [main]
    paths:
      - "plugins/hermes-avatar/**"
      - "web/src/plugins/**"
      - "web/src/pages/PluginsPage.tsx"
      - "web/src/main.tsx"
      - "web/src/lib/vite-preload-recovery*"
      - "hermes_cli/web_server.py"
      - "hermes_cli/dashboard_auth/**"
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/railway-plugin-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-digital-human-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe deployed Digital Human discovery contract
        env:
          BASE_URL: https://brilliant-expression-production-c3d8.up.railway.app
        shell: bash
        run: |
          set -euo pipefail

          discovery_url="${BASE_URL}/api/dashboard/plugins?railway_smoke=${GITHUB_SHA}"
          plugins_page_url="${BASE_URL}/plugins?railway_smoke=${GITHUB_SHA}"
          entry_url="${BASE_URL}/dashboard-plugins/hermes-avatar/dist/digital-human-entry.js?railway_smoke=${GITHUB_SHA}"

          for attempt in $(seq 1 36); do
            discovery_code="$(curl -sS --max-time 15 -o /tmp/dashboard-plugins.json -w '%{http_code}' "${discovery_url}" || true)"

            if [[ "${discovery_code}" == "200" ]] && \
               jq -e '.[] | select(.name == "hermes-avatar" and .tab.path == "/digital-human" and .entry == "dist/digital-human-entry.js" and .version == "0.8.3" and .source == "bundled")' \
                 /tmp/dashboard-plugins.json >/dev/null; then
              page_code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "${plugins_page_url}" || true)"
              entry_code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "${entry_url}" || true)"

              # Public Railway binds redirect unauthenticated HTML/static requests
              # to /login. Once the SPA is authenticated, the same-origin cookie
              # accompanies plugin script requests. A 200 or auth redirect here is
              # healthy; /api/dashboard/plugins above is the authoritative public
              # discovery check and must contain hermes-avatar.
              if [[ "${page_code}" =~ ^(200|302|303|307|308)$ ]] && \
                 [[ "${entry_code}" =~ ^(200|302|303|307|308)$ ]]; then
                echo "Digital Human discovery is live (attempt ${attempt}); page=${page_code} entry=${entry_code}."
                jq -c '.[] | select(.name == "hermes-avatar")' /tmp/dashboard-plugins.json
                exit 0
              fi
            fi

            echo "attempt=${attempt} discovery=${discovery_code}"
            if [[ -s /tmp/dashboard-plugins.json ]]; then
              cat /tmp/dashboard-plugins.json || true
            fi
            sleep 10
          done

          echo "Railway Digital Human discovery smoke probe failed." >&2
          cat /tmp/dashboard-plugins.json >&2 2>/dev/null || true
          exit 1
