name: Frontend Docker Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "web/**"
      - "ui-tui/**"
      - "apps/shared/**"
      - ".github/workflows/frontend-docker-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: frontend-docker-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate diagnostic Dockerfile
        shell: python
        run: |
          from pathlib import Path

          path = Path("Dockerfile")
          lines = path.read_text().splitlines()
          match = None

          for index in range(len(lines) - 1):
              if (
                  lines[index].startswith("RUN cd web && npm run build")
                  and lines[index + 1].strip() == "cd ../ui-tui && npm run build"
              ):
                  match = index
                  break

          if match is None:
              raise SystemExit("Expected combined frontend build step not found in Dockerfile")

          lines[match : match + 2] = [
              "RUN cd web && npm run build",
              "RUN cd ui-tui && npm run build",
          ]
          Path("Dockerfile.frontend-diagnostics").write_text("\n".join(lines) + "\n")

      - name: Build image with split frontend layers
        run: |
          docker build \
            --progress=plain \
            --build-arg HERMES_GIT_SHA=${{ github.sha }} \
            -f Dockerfile.frontend-diagnostics \
            -t hermes-frontend-diagnostics:${{ github.sha }} \
            .
