name: Fly Production Deploy

on:
  workflow_dispatch:

concurrency:
  group: fly-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_APP_NAME: hermos-moatasim
  FLY_REGION: sin

jobs:
  deploy:
    name: Deploy Hermes to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Verify Fly authentication
        run: flyctl auth whoami

      - name: Ensure Fly app exists
        shell: bash
        run: |
          set -euo pipefail
          if flyctl apps list --json | jq -e --arg app "$FLY_APP_NAME" '.[] | select(.Name == $app or .name == $app)' >/dev/null; then
            echo "Fly app $FLY_APP_NAME already exists."
          else
            flyctl apps create "$FLY_APP_NAME"
          fi

      - name: Ensure persistent volume exists
        shell: bash
        run: |
          set -euo pipefail
          if flyctl volumes list -a "$FLY_APP_NAME" --json | jq -e '.[] | select(.name == "hermes_data")' >/dev/null; then
            echo "Volume hermes_data already exists."
          else
            flyctl volumes create hermes_data -a "$FLY_APP_NAME" --region "$FLY_REGION" --size 5 --yes
          fi

      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml -a "$FLY_APP_NAME"

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          flyctl status -a "$FLY_APP_NAME"
          flyctl checks list -a "$FLY_APP_NAME"
