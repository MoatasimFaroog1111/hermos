name: Frontend Workspace Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "web/**"
      - "ui-tui/**"
      - "apps/shared/**"
      - ".github/workflows/frontend-workspace-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: frontend-workspace-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install monorepo dependencies like Docker
        env:
          npm_config_install_links: "false"
        run: npm install --prefer-offline --no-audit --fetch-retries=5

      - name: Build web workspace
        run: npm run build --workspace web

  build-ui-tui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install monorepo dependencies like Docker
        env:
          npm_config_install_links: "false"
        run: npm install --prefer-offline --no-audit --fetch-retries=5

      - name: Build ui-tui workspace
        run: npm run build --workspace hermes-tui

  apply-three-types-fix:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Generate and commit exact Three type metadata
        env:
          npm_config_install_links: "false"
        run: |
          if grep -q '"@types/three"' web/package.json; then
            echo "@types/three is already recorded; no write needed."
            exit 0
          fi

          npm install \
            --workspace web \
            --save-dev \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            @types/three@0.180.0

          git diff --check
          git diff -- web/package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json package-lock.json
          git commit -m "Add Three.js TypeScript declarations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
