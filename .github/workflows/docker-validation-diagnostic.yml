name: Docker Validation Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "web/**"
      - "ui-tui/**"
      - "apps/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docker.yml"
      - ".github/workflows/docker-validation-diagnostic.yml"

permissions:
  contents: read

jobs:
  docker:
    uses: ./.github/workflows/docker.yml
