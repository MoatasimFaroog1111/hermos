<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة الألماس العلوية - السماء</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome for essential action -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sky: {
                            light: '#e0f2fe',
                            base: '#38bdf8',
                            deep: '#0284c7',
                            atm: '#0369a1'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 45%, #e0f2fe 100%);
            color: #1e293b;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* Canvas view top 3/4 */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 75vh;
            z-index: 10;
        }

        /* Sky Glassmorphism Bottom 1/4 Zone */
        .bottom-ui-zone {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            z-index: 20;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, rgba(240, 249, 255, 0.65) 40%, rgba(224, 242, 254, 0.9) 100%);
            backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* Minimal Input Container */
        .sky-input-box {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(30px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(186, 230, 253, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .sky-input-box:focus-within {
            background: rgba(255, 255, 255, 0.9);
            border-color: #38bdf8;
            box-shadow: 0 20px 45px rgba(56, 189, 248, 0.25), inset 0 0 25px rgba(255, 255, 255, 0.9);
        }

        /* Custom Scrollbar for response box */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(2, 132, 199, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.4);
            border-radius: 5px;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between select-none">

    <!-- TOP 3/4: THREE.JS 3D SKY DIAMONDS CANVAS -->
    <div class="relative w-full h-[75vh]">
        <div id="canvas-container"></div>

        <!-- Chat Response Overlay (Pure minimalist floating box when answering) -->
        <div id="response-modal" class="absolute inset-x-6 top-8 bottom-6 z-30 hidden pointer-events-auto p-6 bg-white/75 backdrop-blur-2xl border border-white/90 rounded-3xl shadow-2xl overflow-y-auto transition-all duration-300 text-slate-800">
            <div class="flex justify-between items-center pb-3 mb-3 border-b border-sky-200/60">
                <span class="text-xs font-bold text-sky-800 tracking-wider">استجابة الألماس</span>
                <button id="close-response" class="text-slate-400 hover:text-sky-700 transition text-lg px-2">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="response-content" class="text-slate-700 leading-relaxed text-base font-cairo">
                <!-- Response will appear here -->
            </div>
        </div>
    </div>

    <!-- BOTTOM 1/4: PURE MINIMALIST CHAT SLOT -->
    <footer class="bottom-ui-zone">
        <div class="w-full max-w-4xl mx-auto">
            <!-- CHAT INPUT RECTANGLE (ONLY THIS IS REMAINING) -->
            <div class="sky-input-box relative w-full flex items-center rounded-2xl px-4 py-2 transition-all duration-300">
                
                <!-- Text Area Input -->
                <textarea id="user-input" rows="1" 
                    placeholder="اكتب رسالتك هنا..." 
                    class="w-full bg-transparent text-slate-800 placeholder-slate-400 text-base md:text-lg focus:outline-none resize-none py-2 px-2 font-cairo font-medium"></textarea>

                <!-- Send Button -->
                <button id="send-btn" class="w-12 h-12 rounded-xl bg-sky-500/15 hover:bg-sky-500/30 text-sky-700 flex items-center justify-center transition-all duration-200 shrink-0 shadow-md active:scale-95 border border-white/80">
                    <i class="fa-solid fa-paper-plane text-base"></i>
                </button>
            </div>
        </div>
    </footer>

    <script>
        let scene, camera, renderer;
        let diamondGroup, sparkleParticles;
        const diamonds = [];
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = (window.innerHeight * 0.75) / 2;

        function initThree() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Scene setup with Atmospheric Soft White Fog
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0xf0f9ff, 0.012);

            // Camera setup
            camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
            camera.position.z = 45;

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(width, height);
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.6;
            container.appendChild(renderer.domElement);

            // High Key Bright Ambient Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 2.2);
            scene.add(ambientLight);

            // Bright Sun Directional Light for sharp sparkling facets
            const sunLight = new THREE.DirectionalLight(0xffffff, 4.5);
            sunLight.position.set(20, 40, 30);
            scene.add(sunLight);

            // Glowing Sky Blue Tint Light
            const cyanGlowLight = new THREE.PointLight(0x0284c7, 6.0, 120);
            cyanGlowLight.position.set(-20, 10, 25);
            scene.add(cyanGlowLight);

            // Intense Diamond Sparkle Light
            const sparkleLight = new THREE.PointLight(0x38bdf8, 8.0, 90);
            sparkleLight.position.set(15, -15, 30);
            scene.add(sparkleLight);

            // Direct White Diamond Glow Light
            const frontGlow = new THREE.PointLight(0xffffff, 6.0, 70);
            frontGlow.position.set(0, 5, 40);
            scene.add(frontGlow);

            // Create Diamond Group
            diamondGroup = new THREE.Group();
            scene.add(diamondGroup);

            // Generate Scattered Glowing Diamonds & Sparkles
            createScatteredDiamonds();
            createGlowingSparkleParticles();

            // Event Listeners for Parallax Movement
            document.addEventListener('mousemove', onDocumentMouseMove, false);
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('touchmove', onDocumentTouchMove, { passive: true });
        }

        function createScatteredDiamonds() {
            // Faceted Smooth Diamond Geometries
            const diamondGeom = new THREE.OctahedronGeometry(1.4, 0); 
            const crystalGeom = new THREE.IcosahedronGeometry(1.1, 0); 
            const biconicalGeom = new THREE.ConeGeometry(1.2, 2.2, 5);

            const count = 170; // Scattered glowing diamond count

            for (let i = 0; i < count; i++) {
                let geom;
                if (i % 3 === 0) geom = crystalGeom;
                else if (i % 3 === 1) geom = biconicalGeom;
                else geom = diamondGeom;

                // High Luminescence Glowing Diamond Material with color tinting
                const diamondMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0xffffff,
                    emissive: 0x38bdf8,
                    emissiveIntensity: Math.random() * 0.6 + 0.65, // High vivid emissive glow
                    roughness: 0.05,
                    metalness: 0.1,
                    transmission: 0.6, // Balanced transparency so saturated color pops clearly
                    ior: 2.417, 
                    reflectivity: 1.0,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.01,
                    opacity: 0.98,
                    transparent: true,
                    flatShading: true 
                });

                const mesh = new THREE.Mesh(geom, diamondMaterial);

                // Random Scatter Positions across top space
                const radiusX = (Math.random() - 0.5) * 85;
                const radiusY = (Math.random() - 0.5) * 52;
                const radiusZ = (Math.random() - 0.5) * 55 - 5;

                mesh.position.set(radiusX, radiusY, radiusZ);

                // Varied Scaling
                const scale = Math.random() * 1.2 + 0.5;
                mesh.scale.set(scale, scale * (Math.random() * 0.4 + 0.85), scale);

                mesh.rotation.x = Math.random() * Math.PI;
                mesh.rotation.y = Math.random() * Math.PI;
                mesh.rotation.z = Math.random() * Math.PI;

                // Palette of Radiant Saturated Glowing Tints (Intense Purple, Emerald, Pink, Cyan)
                const tintType = i % 6;
                if (tintType === 0) {
                    // Saturated Electric Purple (بنفسجي زاهي نيون)
                    mesh.material.color.setHex(0xa855f7);
                    mesh.material.emissive.setHex(0x9333ea);
                } else if (tintType === 1) {
                    // Vibrant Neon Emerald (زمردي نقي متوهج)
                    mesh.material.color.setHex(0x10b981);
                    mesh.material.emissive.setHex(0x059669);
                } else if (tintType === 2) {
                    // Vivid Crimson Pink (وردي زاهي قوي)
                    mesh.material.color.setHex(0xf43f5e);
                    mesh.material.emissive.setHex(0xe11d48);
                } else if (tintType === 3) {
                    // Bright Magenta Pink (وردي أرجواني متلألئ)
                    mesh.material.color.setHex(0xec4899);
                    mesh.material.emissive.setHex(0xdb2777);
                } else if (tintType === 4) {
                    // Sky Cyan Glow (أزرق سماوي نقي)
                    mesh.material.color.setHex(0x38bdf8);
                    mesh.material.emissive.setHex(0x0284c7);
                } else if (tintType === 5) {
                    // Pure Diamond Crystal Light (أبيض ألماس ناصع)
                    mesh.material.color.setHex(0xffffff);
                    mesh.material.emissive.setHex(0x7dd3fc);
                }

                // Smooth Floating & Pulsation Dynamics
                mesh.userData = {
                    rotSpeedX: (Math.random() - 0.5) * 0.015,
                    rotSpeedY: (Math.random() - 0.5) * 0.02,
                    rotSpeedZ: (Math.random() - 0.5) * 0.012,
                    floatSpeed: Math.random() * 0.008 + 0.004,
                    floatOffset: Math.random() * Math.PI * 2,
                    pulseSpeed: Math.random() * 2.5 + 1.5,
                    baseEmissiveIntensity: mesh.material.emissiveIntensity,
                    initialY: radiusY,
                    initialX: radiusX
                };

                diamondGroup.add(mesh);
                diamonds.push(mesh);
            }
        }

        function createGlowingSparkleParticles() {
            const particleCount = 500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const purpleColor = new THREE.Color(0xa855f7);
            const emeraldColor = new THREE.Color(0x10b981);
            const pinkColor = new THREE.Color(0xf43f5e);
            const skyColor = new THREE.Color(0x38bdf8);
            const whiteColor = new THREE.Color(0xffffff);

            const colorPalette = [purpleColor, emeraldColor, pinkColor, skyColor, whiteColor];

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 90;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 55;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 60;

                const mixedColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Glowing Circular Particle Texture
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.9)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(16, 16, 16, 0, Math.PI * 2);
            ctx.fill();

            const pTexture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                size: 2.2,
                map: pTexture,
                transparent: true,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 0.95
            });

            sparkleParticles = new THREE.Points(geometry, material);
            scene.add(sparkleParticles);
        }

        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - windowHalfX) * 0.04;
            mouseY = (event.clientY - windowHalfY) * 0.04;
        }

        function onDocumentTouchMove(event) {
            if (event.touches.length > 0) {
                mouseX = (event.touches[0].clientX - windowHalfX) * 0.04;
                mouseY = (event.touches[0].clientY - windowHalfY) * 0.04;
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Smooth parallax camera sway following cursor/touch
            targetX += (mouseX - targetX) * 0.05;
            targetY += (-mouseY - targetY) * 0.05;

            camera.position.x = targetX * 0.3;
            camera.position.y = targetY * 0.3;
            camera.lookAt(scene.position);

            // Rotate overall diamond cluster slowly
            diamondGroup.rotation.y = elapsedTime * 0.03;

            if (sparkleParticles) {
                sparkleParticles.rotation.y = elapsedTime * 0.015;
                sparkleParticles.rotation.x = Math.sin(elapsedTime * 0.5) * 0.05;
            }

            // Animate each glowing diamond individually
            diamonds.forEach((diamond) => {
                const data = diamond.userData;

                diamond.rotation.x += data.rotSpeedX;
                diamond.rotation.y += data.rotSpeedY;
                diamond.rotation.z += data.rotSpeedZ;

                // Smooth floating up and down
                diamond.position.y = data.initialY + Math.sin(elapsedTime * 1.8 + data.floatOffset) * 0.85;
                diamond.position.x = data.initialX + Math.cos(elapsedTime * 1.2 + data.floatOffset) * 0.35;

                // Dynamic glowing pulsation effect (Emissive Pulse)
                diamond.material.emissiveIntensity = data.baseEmissiveIntensity + Math.sin(elapsedTime * data.pulseSpeed + data.floatOffset) * 0.25;
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('load', () => {
            initThree();
            animate();
        });
    </script>

    <script>
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const responseModal = document.getElementById('response-modal');
        const responseContent = document.getElementById('response-content');
        const closeResponse = document.getElementById('close-response');
        const chatHistory = [];

        closeResponse.addEventListener('click', () => {
            responseModal.classList.add('hidden');
        });

        async function handleSend() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            // Open clean glass response modal
            responseModal.classList.remove('hidden');
            responseContent.innerHTML = `<div class="flex items-center gap-3 text-sky-700 font-cairo font-semibold">
                <i class="fa-solid fa-spinner animate-spin"></i>
                <span>جاري المعالجة...</span>
            </div>`;
            
            userInput.value = '';

            try {
                chatHistory.push({ role: "user", parts: [{ text: prompt }] });

                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const payload = {
                    contents: chatHistory,
                    systemInstruction: { parts: [{ text: "أنت ذكاء اصطناعي مستقبل بلغة عربية أنيقة وسلسة في واجهة ألماسية ناصعة البياض مع لمسات سحابية." }] }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Status: ${response.status}`);
                }

                const result = await response.json();
                const replyText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (replyText) {
                    chatHistory.push({ role: "model", parts: [{ text: replyText }] });
                    responseContent.innerText = replyText;
                } else {
                    responseContent.innerText = "لم يتم در استجابة واضحة.";
                }
            } catch (err) {
                responseContent.innerText = "حدث خطأ أثناء الاتصال: " + err.message;
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
